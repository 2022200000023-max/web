<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colour Changing Panel</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            }
        body { 
            font-family: Georgia, 'Times New Roman', Times, serif; 
            background: #a2c6e7; 
            display: flex; 
            justify-content: center; 
            padding: 50px; 
        }

        .container {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            text-align: center;
            width: 600px;
        }
        h2 { 
            color: #1c092b; 
            margin-bottom: 20px; 
        }
        #colorBox {
            width: 100%;
            height: 200px;
            border-radius: 20px;
            background: #eee;
            margin: 20px 0;
            transition: background 0.5s;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: white;
        }
        .btn-group { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 10px; 
        }
        button {
            padding: 13px 26px;
            font-size: 16px;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.2s;
             }
        button:hover { 
            transform: scale(1.1); 
            }
        #colorMsg {
            margin-top: 25px;
            font-size: 25px;
            font-weight: bold;
            color: #1c092b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Colour Changing Button Panel</h2>
        <div id="colorBox">Click a button!</div>
        <div class="button-group">
            <button style="background:red;" onclick="changeColor('red','Red')">Red</button>
            <button style="background:blue;" onclick="changeColor('blue','Blue')">Blue</button>
            <button style="background:green;" onclick="changeColor('green','Green')">Green</button>
            <button style="background:goldenrod;" onclick="changeColor('goldenrod','Yellow')">Yellow</button>
            <button style="background:purple;" onclick="changeColor('purple','Purple')">Purple</button>
        </div>
        <div id="colorMsg">Current colour: None</div>
    </div>

    <script>
        function changeColor(color, name) {
            document.getElementById("colorBox").style.background = color;
            document.getElementById("colorBox").innerText = name;
            document.getElementById("colorMsg").innerText = "Current colour: " + name;
        }
    </script>
</body>
</html>
