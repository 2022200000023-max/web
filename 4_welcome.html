<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Page</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; padding: 0; 
        }
        body { font-family: 'Tai', 'Times New Roman', serif;
            display: flex; justify-content: center; 
            align-items: center; 
            height: 100vh; 
            transition: background 0.5s; 
             }

        .container {
            background: white;
            padding: 50px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }
        h1 { color: #1c092b; 
            font-size: 32px;
        }
        p { 
            color: #555; 
            margin-top: 10px; 
            font-size: 18px; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="welcomeHeading">Welcome!</h1>
        <p id="subMsg"></p>
    </div>

    <script>
        window.onload = function() {
            let n = prompt("What is your name?");
            let c = prompt("What is your favourite colour?");

            if (n && n.trim() !== "") {
                document.getElementById("welcomeHeading").innerText = "Welcome, " + n + "!";
                document.getElementById("subMsg").innerText = "Happy to see you here, " + n + "!";
            } else {
                document.getElementById("welcomeHeading").innerText = "Welcome, Guest!";
                document.getElementById("subMsg").innerText = "No name was entered.";
            }

            if (c && c.trim() !== "") {
                document.body.style.backgroundColor = c;
            }
        }
    </script>
</body>
</html>
