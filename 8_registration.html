<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        * { box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
             }
        body { 
            font-family:Times New Roman, calibari;
            background: #50bcca; 
            display: flex; 
            justify-content: right; 
            padding: 50px; }

        .container {
            background: rgb(178, 211, 103);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(241, 128, 128, 0.1);
            width: 400px;
        }
        h2 { 
            color: #09020f; 
            text-align: center; 
            margin-bottom: 60px; 
        }
        label { 
            display: block; 
            margin-top: 15px; 
            font-weight: bold; 
            color: #110e0e;
             }
        input {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            border: 2px solid #ccc;
            border-radius: 8px;
            margin-top: 8px;
        }
        input:focus { 
            border-color: #007bff; 
            outline: none; 
        }
        .error { color: rgb(32, 143, 87); font-size: 13px; margin-top: 3px; 
                }
        button {
            width: 100%;
            margin-top: 28px;
            padding: 13px;
            font-size: 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover {
             background: #0056b3; 
        }

        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }
        .modal-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
        .modal-box h3 { 
            color: #1c092b; 
            margin-bottom: 20px; 
            font-size: 20px; 
              }
        .modal-box button { 
            width: auto; 
            padding: 10px 30px; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Registration-Form</h2>

        <label>Full Name</label>
        <input type="text" id="fullName" placeholder="Enter your full name">
        <div class="error" id="nameError"></div>

        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email">
        <div class="error" id="emailError"></div>

        <label>Age</label>
        <input type="number" id="age" placeholder="Enter your age (18-65)">
        <div class="error" id="ageError"></div>

        <label>Password</label>
        <input type="password" id="password" placeholder="Min 8 characters">
        <div class="error" id="passError"></div>

        <button onclick="submitForm()">Register</button>
    </div>

    
    <div id="modal">
        <div class="modal-box">
            <h3 id="modalMsg"></h3>
            <button onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        function submitForm() {
            let name = document.getElementById("fullName").value.trim();
            let email = document.getElementById("email").value.trim();
            let age = parseInt(document.getElementById("age").value);
            let password = document.getElementById("password").value;

            document.getElementById("nameError").innerText = "";
            document.getElementById("emailError").innerText = "";
            document.getElementById("ageError").innerText = "";
            document.getElementById("passError").innerText = "";

            if (name === "") {
                alert("Name must not be empty!");
                return;
            }
            if (email === "" || !email.includes("@")) {
                alert("Please enter a valid email address!");
                return;
            }
            if (isNaN(age) || age < 18 || age > 65) {
                alert("Age must be between 18 and 65!");
                return;
            }
            if (password.length < 8) {
                alert("Password must be at least 8 characters!");
                return;
            }

            document.getElementById("modalMsg").innerText = "Registration successful! Welcome, " + name + ".";
            document.getElementById("modal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("modal").style.display = "none";
        }
    </script>
</body>
</html>
