<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Checker</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; padding: 0; }
        body { 
            font-family: Verdana, Geneva, Tahoma, calibri ; 
            background: #f4f4f4; 
            display: flex; 
            justify-content: center;
            align-items: center; 
            height: 100vh; 
        }

        .container {
            background: rgb(131, 185, 206);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 400px;
        }
        h2 { color: #1c092b; margin-bottom: 20px; }
        input {
            padding: 10px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 5px;
            width: 100%;
            margin-bottom: 15px;
        }
        input:focus { border-color: #007bff; outline: none; }
        button {
            padding: 10px 25px;
            font-size: 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
        button:hover { 
            background: #0056b3; 
        }
        #gradeResult {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Student Grade Checker</h2>
        <input type="number" id="marks" placeholder="Enter marks (0-100)">
        <button onclick="checkGrade()">Check Grade</button>
        <div id="gradeResult"></div>
    </div>

    <script>
        function checkGrade() {
            let marks = parseFloat(document.getElementById("marks").value);

            if (isNaN(marks) || marks < 0 || marks > 100) {
                alert("Please enter a valid number between 0 and 100!");
                return;
            }

            let grade, color;
            if (marks >= 70) { grade = "A"; color = "green"; }
            else if (marks >= 60) { grade = "B"; color = "#007bff"; }
            else if (marks >= 50) { grade = "C"; color = "orange"; }
            else if (marks >= 40) { grade = "D"; color = "red"; }
            else { grade = "Fail"; color = "darkred"; }

            document.getElementById("gradeResult").innerHTML =
            "Grade: <span style='color:" + color + "'>" + grade + "</span>";
        }
    </script>
</body>
</html>
