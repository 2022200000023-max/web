<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Calculator</title>
    <style>
        body { 
            font-family:'Times New Roman', ; 
            background:#8b8888; 
            display:flex; 
            justify-content:center; 
            align-items:center; 
            height:100vh; margin:0; }
        .calculator { 
            background:white; 
            padding:70px; 
            border-radius:10px; 
            box-shadow:0 0 15px rgba(0,0,0,0.2); 
            text-align:center; 
            }

        input { 
            padding:10px; 
            font-size:16px; 
            border:2px solid #e9a0a0; 
            border-radius:5px; width:120px; margin:5px;
            }
        select { 
            padding:10px; 
            font-size:16px; 
            border:2px solid #ccc; 
            border-radius:5px; margin:5px; 
               }
        button { 
            margin:5px; 
            padding:10px 20px; 
            font-size:16px; border:none; 
            border-radius:5px; cursor:pointer; 
        }
        .calc-button{ 
            background:#000b16; color:rgb(241, 141, 141); 
        }
        .clear-button { 
            background:#dc3545; color:rgb(245, 148, 148); 
        }
        button:hover { opacity: 0.95;
        }
        result { 
            margin-top:20px; 
            font-size:24px; 
            font-weight:bold; color:#1c092b;  
              }
    </style>
</head>
<body>
    <div class="calculator">
        <h2>Simple Calculator</h2>
        <input type="number" id="num1" placeholder="Number 1">
        <select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">×</option>
            <option value="/">/</option>
        </select>
        <input type="number" id="num2" placeholder="Number 2">
        <br>
        <button class="calc-button" onclick="calculate()">Calculate</button>
        <button class="clear-button" onclick="clearAll()">Clear</button>
        <div id="result"></div>
    </div>
    <script>
        function calculate() {
            let num1 = parseFloat(document.getElementById("num1").value);
            let num2 = parseFloat(document.getElementById("num2").value);
            let operator = document.getElementById("operator").value;
            let result;
            if (isNaN(num1) || isNaN(num2)) {
                alert("Please enter both numbers!");
                return;
            }
            if (operator === "+" ) result = num1 + num2;
            else if (operator === "-") result = num1 - num2;
            else if (operator === "*") result = num1 * num2;
            else if (operator === "/") {
                if (num2 === 0) { alert("Cannot divide by zero!"); return; }
                result = num1 / num2;
            }
            document.getElementById("result").innerHTML = "Result: <span style='color:#007bff'>" + result + "</span>";
        }

        function clearAll() {
            let confirmed = confirm("Are you sure that you want to clear?");
            if (confirmed) {
                document.getElementById("num1").value = "";
                document.getElementById("num2").value = "";
                document.getElementById("result").innerHTML = "";
            }
        }
    </script>
</body>
</html>
